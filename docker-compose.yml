services:
  web:
    build:
      context: .
      target: runtime
    image: portfolio
    ports:
      - '8080:8080'
    restart: unless-stopped

  dev:
    profiles: ['dev']
    build:
      context: .
      target: deps
    command: npm run dev -- --host 0.0.0.0
    environment:
      CHOKIDAR_USEPOLLING: 'true'
    ports:
      - '5173:5173'
    volumes:
      - .:/app
      - /app/node_modules
