name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20.18'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test

  smoke:
    name: Smoke (build + HTTP 200)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PREVIEW_URL: http://127.0.0.1:4173/
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Serve the production bundle
        run: npx vite preview --host 127.0.0.1 --port 4173 --strictPort > preview.log 2>&1 &
      - name: Expect HTTP 200 from the app
        run: |
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --retry 20 --retry-delay 1 --retry-connrefused "$PREVIEW_URL")
          echo "GET $PREVIEW_URL -> $status"
          test "$status" = "200"
      - name: Preview server log
        if: failure()
        run: cat preview.log
